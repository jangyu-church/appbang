<!DOCTYPE html>
<html lang="ko" data-theme="auto" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 사랑방</title>
<meta name="description" content="목회자들이 함께 만들고 함께 다듬는 앱 갤러리">
<meta name="theme-color" content="#2E7D6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="앱 사랑방">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F5F8F6; --card:#FFFFFF; --ink:#1F2A27; --sub:#5F6D69; --line:#DFE8E4;
  --pri:#2E7D6B; --pri-ink:#FFFFFF; --pri-soft:#E3F1EC; --blue:#2F6FAE; --blue-soft:#E4EEF8;
  --warm:#C77A2B; --warm-soft:#FBEFE1; --ok:#2E7D32; --ok-soft:#E5F3E6; --red:#B4433A; --soft:#EEF3F1;
  --shadow:0 2px 10px rgba(31,42,39,.07);
}
html[data-theme="dark"]{
  --bg:#121816; --card:#1B2321; --ink:#EEF3F1; --sub:#A4B2AE; --line:#2B3633;
  --pri:#5BB89F; --pri-ink:#0E1715; --pri-soft:#1F3631; --blue:#7FB0E3; --blue-soft:#1D2B3A;
  --warm:#E3A866; --warm-soft:#33281C; --ok:#7CC781; --ok-soft:#1E3220; --red:#E58A80; --soft:#222C29;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#121816; --card:#1B2321; --ink:#EEF3F1; --sub:#A4B2AE; --line:#2B3633;
    --pri:#5BB89F; --pri-ink:#0E1715; --pri-soft:#1F3631; --blue:#7FB0E3; --blue-soft:#1D2B3A;
    --warm:#E3A866; --warm-soft:#33281C; --ok:#7CC781; --ok-soft:#1E3220; --red:#E58A80; --soft:#222C29;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html[data-size="big"]{font-size:24px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--blue)}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-size:1.1rem}
.icon-btn{min-width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:700;padding:0 10px;display:inline-flex;align-items:center;gap:4px}
.icon-btn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}

.hero{padding:22px 0 6px}
.hero h1{font-size:1.75rem;line-height:1.3;margin:0 0 6px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--sub)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--pri-soft);border-radius:14px;padding:12px 14px;margin:14px 0 0;font-size:.95rem}
.demo{background:var(--warm-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.45rem;line-height:1.2;color:var(--pri)}
.stat span{font-size:.8rem;color:var(--sub)}

.toolbar{display:flex;gap:8px;margin:16px 0 10px}
.search{flex:1;min-width:0;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px}
.select{flex:none;max-width:42%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;text-decoration:none;border:1px solid transparent;text-align:center}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.line{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.88rem;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left;width:100%;transition:transform .12s}
.card:active{transform:scale(.99)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden}
@media (max-width:560px){.thumb{aspect-ratio:16/10}}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:3.2rem}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
.thumb .badge{position:absolute;left:10px;top:10px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.badge.help{background:var(--warm-soft);color:var(--warm)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.build{background:var(--blue-soft);color:var(--blue)}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:1.15rem;line-height:1.35}
.card .desc{margin:0;color:var(--sub);font-size:.95rem;flex:1}
.meta{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.meta .who{margin-right:auto;font-weight:600;color:var(--ink)}
.add-card{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:220px;color:var(--pri);font-weight:800;gap:6px}
.add-card .plus{font-size:2.4rem;line-height:1}
.empty{text-align:center;color:var(--sub);padding:40px 10px}

section.blk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
section.blk>h2{font-size:1.15rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
section.blk>h2 small{font-weight:600;color:var(--sub);font-size:.8rem;margin-left:auto}
.sub{color:var(--sub);font-size:.9rem}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700;color:var(--sub);margin:12px 0 0}

.detail-head{padding:8px 0 0}
.detail-head h1{font-size:1.7rem;line-height:1.3;margin:8px 0 4px;letter-spacing:-.02em}
.detail-head .desc{font-size:1.05rem;color:var(--sub);margin:0}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 8px;margin:14px 0 4px}
.shots button{flex:none;scroll-snap-align:start;width:min(78%,360px);aspect-ratio:9/14;border-radius:16px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.shots img{width:100%;height:100%;object-fit:contain;display:block}
.cta{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
@media (min-width:640px){.cta{grid-template-columns:2fr 1fr 1fr}}
ol.howto{margin:0;padding-left:1.4em}
ol.howto li{margin:4px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fact{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:.88rem}
.fact b{color:var(--pri)}
.story{white-space:pre-wrap;margin:0}
pre.prompt{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.85rem;max-height:260px;overflow:auto;margin:0 0 10px;font-family:inherit}
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--pri-soft);margin-left:6px}
.timeline li{position:relative;padding:0 0 14px 18px}
.timeline li::before{content:"";position:absolute;left:-8px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--pri);border:2px solid var(--card)}
.timeline .when{font-size:.8rem;color:var(--sub)}

.post{border-top:1px solid var(--line);padding:14px 0}
.post:first-of-type{border-top:0}
.post .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--sub)}
.post .hd b{color:var(--ink)}
.post .tx{margin:6px 0 0;white-space:pre-wrap}
.post .ft{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.post.done{background:linear-gradient(90deg,var(--ok-soft),transparent 70%);margin:0 -18px;padding:14px 18px}
.done-note{margin-top:8px;font-size:.9rem;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px}
.like{min-height:40px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:.88rem;font-weight:700}
.like.on{background:var(--pri-soft);color:var(--pri)}
.type-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media (min-width:640px){.type-tabs{grid-template-columns:repeat(4,1fr)}}
.type-tabs button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem}
.type-tabs button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.tip{font-size:.85rem;color:var(--sub);background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0}

label.f{display:block;font-weight:700;margin:16px 0 6px}
label.f small{font-weight:500;color:var(--sub)}
.in,textarea.in,select.in{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 14px}
textarea.in{min-height:110px;resize:vertical;line-height:1.55}
.in:focus{outline:3px solid var(--pri-soft);border-color:var(--pri)}
.check{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.92rem}
.check input{width:22px;height:22px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:12px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;font-size:.8rem;color:var(--sub);text-align:center}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:1rem;z-index:2}
.slot .tag{position:absolute;left:4px;bottom:4px;background:var(--pri);color:var(--pri-ink);font-size:.7rem;padding:1px 7px;border-radius:6px;z-index:2}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:8px 0 10px;font-size:.8rem;color:var(--sub);font-weight:700;min-height:64px}
nav.tabs button span{display:block;font-size:1.45rem;line-height:1.25}
nav.tabs button[aria-current="page"]{color:var(--pri)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.modal h2{margin:0 0 4px;font-size:1.25rem;display:flex;align-items:center}
.modal h2 .x{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:1.2rem}
.modal .actions{display:flex;gap:8px;margin-top:20px}
.modal .actions .btn{flex:1}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lightbox img{max-height:92vh;max-width:100%;object-fit:contain;border-radius:8px}
.qr-box{display:grid;place-items:center;gap:10px;text-align:center;padding:10px 0}
.qr-box #qr{background:#fff;padding:14px;border-radius:14px}
.qr-box .url{font-size:.85rem;color:var(--sub);word-break:break-all}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1F2A27;color:#fff;padding:12px 20px;border-radius:999px;font-size:.92rem;z-index:80;max-width:90%;text-align:center}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.feed li:first-child{border-top:0}
.feed .em{flex:none;font-size:1.2rem}
.feed a{color:inherit;text-decoration:none}
.feed .t{color:var(--sub);font-size:.8rem}
details.guide{border-top:1px solid var(--line);padding:10px 0}
details.guide:first-of-type{border-top:0}
details.guide summary{font-weight:700;cursor:pointer;min-height:40px;display:flex;align-items:center}
.two{display:grid;gap:14px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr;align-items:start}.two section.blk{margin:0}}
.vis-hide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true">⛪</span>앱 사랑방</a>
  <button class="icon-btn" id="btnQR" title="이 갤러리 QR 코드">📱 QR</button>
  <button class="icon-btn" id="btnSize" aria-pressed="false" title="강의용 큰 글씨">가<b>가</b></button>
  <button class="icon-btn" id="btnTheme" title="밝게/어둡게">🌓</button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="메뉴"><div class="wrap">
  <button data-tab="home"><span>🏠</span>앱 구경</button>
  <button data-tab="ideas"><span>💡</span>아이디어</button>
  <button data-tab="learn"><span>🎓</span>배움터</button>
  <button data-tab="qna"><span>💬</span>묻고 답하기</button>
</div></nav>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG=window.APPBANG_CONFIG||{};
var API_URL=(CFG.API_URL||'').trim();
var FORCE_DEMO=/[?&]demo(=1)?(&|$)/.test(location.search);
var DEMO=!API_URL||FORCE_DEMO;
var REAL_URL=location.href.split('#')[0].split('?')[0];

var CATS=[['설교·말씀','📖'],['교육·양육','🌱'],['기도·묵상','🙏'],['예배·찬양','🎵'],['행정·재정','📋'],['교제·소통','🤝'],['기타','✨']];
var STATUS={'사용 중':['✅','ok'],'만드는 중':['🔨','build'],'도움이 필요해요':['🙋','help']};
var FTYPE={idea:['💡','아이디어','이런 기능이 있으면 좋겠어요'],fix:['🔧','바꿔 주세요','여기를 이렇게 고치면 더 편하겠어요'],bug:['🐞','오류 발견','눌렀더니 이런 문제가 생겨요'],thanks:['🙏','잘 쓰고 있어요','이 앱 덕분에 이런 도움을 받았어요']};
var TOOLS=['Claude','ChatGPT','Gemini','Cursor','Copilot'];
var HOURS=['1시간 이내','반나절','하루','2~3일','일주일','일주일 이상'];

/* ---------- 작은 도구 ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function okUrl(u){return /^https?:\/\/[^\s"'<>]+$/i.test(String(u||'').trim())}
function catEm(c){var f=CATS.find(function(x){return x[0]===c});return f?f[1]:'✨'}
function ago(s){
  if(!s)return '';var d=new Date(String(s).replace(' ','T')+':00+09:00');if(isNaN(d))return s;
  var m=Math.round((Date.now()-d)/60000);
  if(m<1)return '방금';if(m<60)return m+'분 전';var h=Math.round(m/60);if(h<24)return h+'시간 전';
  var dd=Math.round(h/24);if(dd<8)return dd+'일 전';return String(s).slice(0,10).replace(/-/g,'.');
}
function now(){var d=new Date(Date.now()+9*3600000);return d.toISOString().slice(0,16).replace('T',' ')}
var store={
  get:function(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var toastT;
function toast(msg){var o=$('.toast');if(o)o.remove();var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2800)}
function copy(text,msg){
  function done(){toast(msg||'복사했어요')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback)}else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('복사가 안 되네요. 길게 눌러 복사해 주세요')}ta.remove()}
}
function shot(src,em,alt){return src&&okUrl(src)||String(src||'').indexOf('data:image')===0?'<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" referrerpolicy="no-referrer">':'<div class="ph" aria-hidden="true">'+esc(em||'✨')+'</div>'}

/* ---------- 상태 ---------- */
var S={
  data:DEMO?null:store.get('ab_cache',null),
  me:store.get('ab_me',''),
  liked:store.get('ab_liked',{}),
  prefs:store.get('ab_prefs',{size:'normal',theme:'auto'}),
  q:'',cat:'전체',sort:'new',qf:'all',ftype:'idea',
  pw:{} /* 이번 방문 동안만 기억하는 앱 비밀번호 */
};
function applyPrefs(){
  document.documentElement.dataset.size=S.prefs.size;
  document.documentElement.dataset.theme=S.prefs.theme;
  $('#btnSize').setAttribute('aria-pressed',S.prefs.size==='big');
}
function D(){return S.data||{apps:[],updates:[],feedback:[],ideas:[],topics:[],demos:[],questions:[],answers:[],config:{}}}
function app(id){return D().apps.find(function(a){return a.id===id})}
function fbOf(id){return D().feedback.filter(function(f){return f.appId===id})}
function setMe(n){n=String(n||'').trim();if(n&&n!=='익명'){S.me=n;store.set('ab_me',n)}}

/* ---------- 서버 ---------- */
function api(action,body){
  body=body||{};
  if(DEMO)return demoApi(action,body);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},body))})
    .then(function(r){return r.json()})
    .then(function(j){if(!j.ok)throw new Error(j.error||'오류가 났어요');return j});
}
function load(quiet,keep){
  return api('all').then(function(j){
    delete j.ok;S.data=j;if(!DEMO)store.set('ab_cache',j);render(keep);
  }).catch(function(e){if(!quiet)toast('연결이 안 돼요. 잠시 후 다시 열어 주세요')});
}
function send(action,body,okMsg,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.innerHTML;btn.innerHTML='<span class="spin"></span> 보내는 중'}
  return api(action,body).then(function(j){
    if(okMsg)toast(okMsg);return load(true).then(function(){return j});
  }).catch(function(e){toast(e.message||'오류가 났어요');throw e})
  .finally(function(){if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=btn.dataset.t}});
}
function like(kind,id,btn){
  var k=kind+':'+id;
  if(S.liked[k]){toast('이미 마음을 표시하셨어요');return}
  S.liked[k]=1;store.set('ab_liked',S.liked);
  var list=D()[kind]||[],o=list.find(function(x){return x.id===id});if(o)o.likes=(o.likes||0)+1;
  if(btn){btn.classList.add('on');var n=btn.querySelector('b');if(n)n.textContent=o?o.likes:'';}
  api('like',{kind:kind,id:id}).catch(function(){});
}

function demoApi(a,b){
  if(!demo)buildDemo();
  var t=now(),me=b.author||'익명',id=function(p){return p+Date.now().toString(36)};
  function ok(x){return new Promise(function(r){setTimeout(function(){r(Object.assign({ok:true},x||{}))},250)})}
  function fail(m){return new Promise(function(_,j){setTimeout(function(){j(new Error(m))},250)})}
  function find(k,i){return demo[k].find(function(x){return x.id===i})}
  switch(a){
    case 'all':return ok(JSON.parse(JSON.stringify(demo)));
    case 'upload':return ok({url:b.data});
    case 'addApp':var ap=Object.assign({},b.app,{id:id('A'),date:t,likes:0,_pw:b.pw});ap.shot1=(b.app.shots||[])[0]||'';ap.shot2=(b.app.shots||[])[1]||'';ap.shot3=(b.app.shots||[])[2]||'';delete ap.shots;demo.apps.push(ap);return ok({id:ap.id});
    case 'checkPw':var x=find('apps',b.id);return x&&(x._pw?x._pw===b.pw:true)?ok():fail('비밀번호가 맞지 않아요');
    case 'editApp':var e=find('apps',b.id);if(e._pw&&e._pw!==b.pw)return fail('비밀번호가 맞지 않아요');Object.assign(e,b.app);var sh=b.app.shots||[];e.shot1=sh[0]||'';e.shot2=sh[1]||'';e.shot3=sh[2]||'';delete e.shots;return ok();
    case 'addUpdate':demo.updates.unshift({id:id('U'),appId:b.appId,date:t,ver:b.ver||'',text:b.text});return ok();
    case 'addFeedback':demo.feedback.push({id:id('F'),appId:b.appId,date:t,type:b.type,author:me,text:b.text,likes:0,done:'',doneNote:''});return ok();
    case 'markFeedback':var f=find('feedback',b.id);f.done=b.done?'Y':'';f.doneNote=b.note||'';return ok();
    case 'addIdea':demo.ideas.push({id:id('I'),date:t,title:b.title,text:b.text,author:me,likes:0,status:'제안',builder:''});return ok();
    case 'claimIdea':var i=find('ideas',b.id);i.builder=i.builder?i.builder+', '+b.builder:b.builder;i.status='만드는 중';return ok();
    case 'addTopic':demo.topics.push({id:id('T'),date:t,title:b.title,text:b.text,author:me,likes:0});return ok();
    case 'addDemo':demo.demos.push({id:id('D'),date:t,app:b.app,presenter:me,when:b.when,note:b.note});return ok();
    case 'addQuestion':demo.questions.push({id:id('Q'),date:t,title:b.title,text:b.text,author:me,solved:''});return ok();
    case 'addAnswer':demo.answers.push({id:id('R'),qId:b.qId,date:t,author:me,text:b.text,likes:0});return ok();
    case 'solveQuestion':find('questions',b.id).solved=b.solved?'Y':'';return ok();
    case 'like':var l=find(b.kind,b.id);if(l)l.likes=(l.likes||0)+1;return ok();
  }
  return fail('알 수 없는 요청');
}

/* ---------- 화면 이동 ---------- */
function route(){
  var p=location.hash.replace(/^#\/?/,'').split('/');
  return {v:p[0]||'home',id:decodeURIComponent(p[1]||'')};
}
function go(h){if(location.hash===h)render();else location.hash=h}
function render(keep){
  var saved={};
  if(keep)$$('#view input[id],#view textarea[id]').forEach(function(el){if(el.type!=='file'&&el.value)saved[el.id]=el.value});
  var r=route(),v=$('#view'),tab={home:'home',app:'home',ideas:'ideas',learn:'learn',qna:'qna',q:'qna'}[r.v]||'home';
  $$('nav.tabs button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(r.v==='app')v.innerHTML=viewApp(r.id);
  else if(r.v==='ideas')v.innerHTML=viewIdeas();
  else if(r.v==='learn')v.innerHTML=viewLearn();
  else if(r.v==='qna')v.innerHTML=viewQna();
  else if(r.v==='q')v.innerHTML=viewQuestion(r.id);
  else v.innerHTML=viewHome();
  var titles={app:(app(r.id)||{}).name,ideas:'아이디어',learn:'배움터',qna:'묻고 답하기',q:'묻고 답하기'};
  document.title=(titles[r.v]?titles[r.v]+' · ':'')+'앱 사랑방';
  Object.keys(saved).forEach(function(k){var el=document.getElementById(k);if(el)el.value=saved[k]});
}

var slotShots=[],slotBusy=0;
function drawSlots(){
  var w=$('#slots');if(!w)return;
  var h='';
  for(var i=0;i<3;i++){
    var s=slotShots[i];
    if(s==='…')h+='<div class="slot"><span><span class="spin"></span><br>올리는 중</span></div>';
    else if(s)h+='<div class="slot"><img src="'+esc(s)+'" alt="스크린샷 '+(i+1)+'" referrerpolicy="no-referrer">'+(i===0?'<span class="tag">대표</span>':'')+'<button type="button" class="x" data-del="'+i+'" aria-label="사진 빼기">✕</button></div>';
    else{h+='<label class="slot"><span>📷<br>사진 '+(i+1)+'<br>고르기</span><input type="file" accept="image/*" data-slot="'+i+'"></label>';break;}
  }
  w.innerHTML=h;
  $$('#slots [data-del]').forEach(function(b){b.onclick=function(){slotShots.splice(+b.dataset.del,1);drawSlots()}});
  $$('#slots input[type=file]').forEach(function(inp){inp.onchange=function(){
    var f=inp.files[0];if(!f)return;var i=+inp.dataset.slot;
    slotShots[i]='…';slotBusy++;drawSlots();
    shrink(f).then(function(data){return api('upload',{data:data})}).then(function(j){slotShots[i]=j.url})
      .catch(function(e){slotShots.splice(i,1);toast(e&&e.message?e.message:'사진을 올리지 못했어요')})
      .finally(function(){slotBusy--;drawSlots()});
  }});
}
function shrink(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var m=1400,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('사진 파일을 읽지 못했어요'))};
    img.src=u;
  });
}

/* ---------- 모달·QR·확대 ---------- */
function modal(title,body,okText,onOk){
  closeModal();
  var m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML='<div class="box"><h2>'+title+'<button class="x" aria-label="닫기">✕</button></h2>'+body+(okText?'<div class="actions"><button class="btn line" data-close>취소</button><button class="btn pri" data-ok>'+okText+'</button></div>':'')+'</div>';
  document.body.appendChild(m);document.body.style.overflow='hidden';
  m.addEventListener('click',function(e){if(e.target===m||e.target.closest('.x')||e.target.closest('[data-close]'))closeModal()});
  var ok=$('[data-ok]',m);
  if(ok)ok.onclick=function(){var p=onOk(ok);if(p&&p.then)p.then(closeModal,function(){})};
  var f=$('input,textarea',m);if(f&&matchMedia('(min-width:700px)').matches)f.focus();
  return m;
}
function closeModal(){var m=$('.modal');if(m){m.remove();document.body.style.overflow=''}}
var qrLib=null;
function showQR(url,title){
  modal('📱 '+esc(title||'앱 사랑방'),'<div class="qr-box"><p class="sub" style="margin:0">폰 카메라로 비추면 바로 열려요</p><div id="qr"><span class="spin"></span></div><div class="url">'+esc(url)+'</div><button class="btn line sm" id="qrCopy">🔗 주소 복사</button>'+(navigator.share?'<button class="btn soft sm" id="qrShare">📤 카톡 등으로 보내기</button>':'')+'</div>');
  $('#qrCopy').onclick=function(){copy(url,'주소를 복사했어요')};
  if($('#qrShare'))$('#qrShare').onclick=function(){navigator.share({title:title||'앱 사랑방',url:url}).catch(function(){})};
  (qrLib||(qrLib=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=res;s.onerror=function(){qrLib=null;rej()};document.head.appendChild(s)})))
    .then(function(){var b=$('#qr');if(!b)return;b.innerHTML='';var sz=Math.min(300,window.innerWidth-120);new window.QRCode(b,{text:url,width:sz,height:sz,correctLevel:window.QRCode.CorrectLevel.M})})
    .catch(function(){var b=$('#qr');if(b)b.innerHTML='<p class="sub">QR을 불러오지 못했어요. 주소를 복사해 주세요.</p>'});
}

    case 'addUpdate':if(cur)updateForm(cur);return;
    case 'fbSend':{
      var tx=$('#fbText').value.trim();if(!tx){toast('의견을 적어 주세요');$('#fbText').focus();return}
      var nm=$('#fbName').value.trim();setMe(nm);
      send('addFeedback',{appId:ds.app,type:S.ftype,author:nm,text:tx},'의견을 보냈어요. 고맙습니다!',t);return;
    }
    case 'iSend':{
      var it=$('#iT').value.trim();if(!it){toast('어떤 앱인지 한 줄로 적어 주세요');$('#iT').focus();return}
      var inn=$('#iN').value.trim();setMe(inn);
      send('addIdea',{title:it,text:$('#iX').value.trim(),author:inn},'아이디어를 올렸어요 💡',t);return;
    }
    case 'tSend':{
      var tt=$('#tT').value.trim();if(!tt){toast('듣고 싶은 주제를 적어 주세요');$('#tT').focus();return}
      var tn=$('#tN').value.trim();setMe(tn);
      send('addTopic',{title:tt,text:$('#tX').value.trim(),author:tn},'신청했어요 🎓',t);return;
    }
    case 'dSend':{
      var da=$('#dA').value.trim();if(!da){toast('시연할 앱 이름을 적어 주세요');$('#dA').focus();return}
      var dn=$('#dN').value.trim();if(!dn){toast('발표자 이름을 적어 주세요');$('#dN').focus();return}setMe(dn);
      send('addDemo',{app:da,when:$('#dW').value.trim(),note:$('#dX').value.trim(),author:dn},'시연 신청을 받았어요 🎤',t);return;
    }
    case 'qSend':{
      var qt=$('#qT').value.trim();if(!qt){toast('질문을 한 줄로 적어 주세요');$('#qT').focus();return}
      var qn=$('#qN').value.trim();setMe(qn);
      send('addQuestion',{title:qt,text:$('#qX').value.trim(),author:qn},'질문을 올렸어요. 곧 답이 달릴 거예요',t);return;
    }
    case 'aSend':{
      var ax=$('#aX').value.trim();if(!ax){toast('답변을 적어 주세요');$('#aX').focus();return}
      var an=$('#aN').value.trim();setMe(an);
      send('addAnswer',{qId:ds.q,text:ax,author:an},'답변을 올렸어요. 고맙습니다!',t);return;
    }
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('change',function(e){if(e.target.id==='sort'){S.sort=e.target.value;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var l=$('.lightbox');if(l)l.remove();else closeModal()}});
window.addEventListener('hashchange',function(){closeModal();render();window.scrollTo(0,0)});
new MutationObserver(function(){var s=$('#sort');if(s&&s.value!==S.sort)s.value=S.sort}).observe($('#view'),{childList:true});

/* ---------- 시작 ---------- */
applyPrefs();
render();
load(!!S.data,true);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('.modal'))load(true,true)});
if('serviceWorker' in navigator&&!DEMO){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>
